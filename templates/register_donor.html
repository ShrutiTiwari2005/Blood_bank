<!DOCTYPE html>
<html>

<head>

<title>Register Donor</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
text-align:center;
}

.container{
width:400px;
margin:auto;
margin-top:80px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
}

input,select{
width:90%;
padding:10px;
margin:10px;
}

button{
padding:10px 20px;
background:#e74c3c;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Register Blood Donor</h2>

<form method="POST">

<input type="text" name="name" placeholder="Name" required>

<input type="number" name="age" placeholder="Age" required>

<select name="blood_group">

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

<input type="text" name="city" placeholder="City" required>

<input type="text" name="phone" placeholder="Phone Number" required>

<input type="date" name="last_donation">

<button type="submit">Register</button>

</form>

{% if message %}
<p>{{message}}</p>
{% endif %}

</div>

</body>

</html>
