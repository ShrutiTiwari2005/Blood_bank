{% extends "base.html" %}

{% block content %}

<h2 class="text-center mb-4">Blood Requests</h2>

<table class="table table-striped table-hover">

<thead class="table-danger">

<tr>
<th>Patient Name</th>
<th>Blood Group</th>
<th>City</th>
<th>Units Required</th>
</tr>

</thead>

<tbody>

{% for r in data %}

<tr>

<td>{{r.patient_name}}</td>
<td>{{r.blood_group}}</td>
<td>{{r.City}}</td>
<td>{{r.Units_required}}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
