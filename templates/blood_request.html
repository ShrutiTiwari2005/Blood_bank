<!DOCTYPE html>
<html>

<head>

<title>Blood Request</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
text-align:center;
}

.container{
width:400px;
margin:auto;
margin-top:80px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
}

input,select{
width:90%;
padding:10px;
margin:10px;
}

button{
padding:10px 20px;
background:#e74c3c;
color:white;
border:none;
cursor:pointer;
}

table{
margin-top:20px;
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:10px;
}

th{
background:#e74c3c;
color:white;
}

</style>

</head>

<body>

<div class="container">

<h2>Request Blood</h2>

<form method="POST">

<input type="text" name="city" placeholder="City" required>

<select name="blood_group">

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

<input type="number" name="units" placeholder="Units Required">

<button type="submit">Request</button>

</form>

{% if message %}
<p>{{message}}</p>
{% endif %}

{% if donors %}

<h3>Available Donors</h3>

<table>

<tr>
<th>Name</th>
<th>Phone</th>
<th>City</th>
</tr>

{% for donor in donors %}

<tr>
<td>{{ donor.Name }}</td>
<td>{{ donor.phone }}</td>
<td>{{ donor.City }}</td>
</tr>

{% endfor %}

</table>

{% endif %}

</div>

</body>

</html>
