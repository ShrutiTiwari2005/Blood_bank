{% extends "base.html" %}

{% block content %}

<!-- v5.0 HEMO-SYNC Patient Onboarding Node -->
<div class="main-content flex items-center justify-center min-h-[90vh] reveal active">
    
    <div class="max-w-xl w-full">
        <div class="clinical-card p-10 shadow-2xl border-t-8 border-t-red-800">
            <div class="text-center mb-10">
                <div class="h-12 w-12 bg-red-700 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-red-900/10">
                    <i data-lucide="user-plus" class="text-white" size="28"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-800 tracking-tight">Onboard Subject</h2>
                <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest mt-3">Hemo-Sync Institutional Priority Registry</p>
            </div>

            <form method="POST" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-slate-400 tracking-[0.2em] ml-1">Subject Name</label>
                    <input type="text" name="name" required 
                        class="w-full bg-slate-50 border border-slate-100 rounded-xl p-4 text-sm font-bold text-slate-800 focus:outline-none focus:border-red-700 transition-all font-mono"
                        placeholder="ENTER PATIENT NAME">
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 tracking-[0.2em] ml-1">Blood Group Hub</label>
                        <select name="blood_group" class="w-full bg-slate-50 border border-slate-100 rounded-xl p-4 text-sm font-bold text-slate-800 focus:outline-none focus:border-red-700 transition-all">
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 tracking-[0.2em] ml-1">Baseline Hb (g/dL)</label>
                        <input type="number" step="0.1" name="current_hb" required 
                            class="w-full bg-slate-50 border border-slate-100 rounded-xl p-4 text-sm font-bold text-slate-800 focus:outline-none focus:border-red-700 transition-all font-mono"
                            placeholder="e.g. 11.5">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-slate-400 tracking-[0.2em] ml-1">Institutional Facility (City)</label>
                    <input type="text" name="city" required 
                        class="w-full bg-slate-50 border border-slate-100 rounded-xl p-4 text-sm font-bold text-slate-800 focus:outline-none focus:border-red-700 transition-all font-mono"
                        placeholder="ENTER Hub LOCATION">
                </div>

                <button type="submit" class="w-full btn-hemo py-5 text-[10px] font-black tracking-widest shadow-xl">
                    INITIALIZE PRIORITY ENTRY
                </button>
            </form>
        </div>
    </div>

</div>

<script>
    lucide.createIcons();
</script>
{% endblock %}
